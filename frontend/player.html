<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing — MystiPlay</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="player" class="player-page">

<div class="state-banner" data-global-error role="alert"></div>

<div class="player-topbar">
  <a href="/index.html" class="back-link" data-back-link>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    Back to Episodes
  </a>
</div>

<main class="player-shell">
  <div class="video-wrap">
<video data-video playsinline></video>



    <div class="player-loading hidden" data-player-loading>
      <div class="spinner"></div>
    </div>

    <div class="player-error hidden" data-player-error>
      <p style="font-weight:700; color:#fff;">Unable to play this video.</p>
      <p>Please check the video URL in <code>data/episodes.json</code>.</p>
      <p data-error-detail style="font-size:12px;"></p>
    </div>
    </div>
  </div>

  <div class="player-meta">
    <div class="player-meta-left">
      <div class="season-label" data-player-season-label>Season</div>
      <h1 data-player-episode-title>Episode</h1>
      <p data-player-episode-desc></p>
    </div>
    <div class="player-nav-btns">
      <button class="btn btn-outline" data-prev-episode>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Previous
      </button>
      <button class="btn btn-ghost" data-player-mylist>+ My List</button>
      <button class="btn btn-outline" data-next-episode>
        Next
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="end-of-season" data-end-of-season></div>
</main>

<script src="/js/app.js"></script>
<script src="/js/player.js"></script>
</body>
</html>
