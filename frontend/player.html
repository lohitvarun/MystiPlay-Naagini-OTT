<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing — MystiPlay</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="player" class="player-page">

<div class="state-banner" data-global-error role="alert"></div>

<div class="player-topbar">
  <a href="/index.html" class="back-link" data-back-link>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
    Back to Episodes
  </a>
</div>

<main class="player-shell">
  <div class="video-wrap">
    <video data-video playsinline></video>

    <button class="skip-intro-btn hidden" data-skip-intro>SKIP INTRO</button>

    <div class="player-loading hidden" data-player-loading>
      <div class="spinner"></div>
    </div>

    <div class="player-error hidden" data-player-error>
      <p style="font-weight:700; color:#fff;">Unable to play this video.</p>
      <p>Please check the video URL in <code>data/episodes.json</code>.</p>
      <p data-error-detail style="font-size:12px;"></p>
    </div>

    <div class="custom-controls">
      <div class="progress-bar" data-progress-bar>
        <div class="progress-buffer" data-progress-buffer></div>
        <div class="progress-fill" data-progress-fill></div>
      </div>
      <div class="controls-row">
        <div class="controls-left">
          <button class="ctrl-btn" data-play-pause aria-label="Play/Pause">
            <svg data-play-icon viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg data-pause-icon viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button class="ctrl-btn" data-mute aria-label="Mute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 8a5 5 0 0 1 0 8"/></svg>
          </button>
          <input type="range" class="volume-slider" data-volume min="0" max="1" step="0.05" value="1" aria-label="Volume">
          <span class="ctrl-time" data-time-label>0:00 / 0:00</span>
        </div>
        <div class="controls-right">
          <select class="speed-select" data-speed aria-label="Playback speed">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
          <button class="ctrl-btn" aria-label="Subtitles">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 13h3M13 13h4M7 16h10"/></svg>
          </button>
          <button class="ctrl-btn" data-fullscreen aria-label="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="player-meta">
    <div class="player-meta-left">
      <div class="season-label" data-player-season-label>Season</div>
      <h1 data-player-episode-title>Episode</h1>
      <p data-player-episode-desc></p>
    </div>
    <div class="player-nav-btns">
      <button class="btn btn-outline" data-prev-episode>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Previous
      </button>
      <button class="btn btn-ghost" data-player-mylist>+ My List</button>
      <button class="btn btn-outline" data-next-episode>
        Next
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div class="end-of-season" data-end-of-season></div>
</main>

<script src="/js/app.js"></script>
<script src="/js/player.js"></script>
</body>
</html>
